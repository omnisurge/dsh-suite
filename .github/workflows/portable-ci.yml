name: Portable CI (G6a)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Portable checks
        run: pnpm run test:portable
      - name: Pack Suite candidate
        run: node portable-checks/pack-suite.mjs "$RUNNER_TEMP/suite-pack"
      - name: Install official CLI
        run: pnpm add -D --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.5
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: CLI web host smoke
        run: pnpm run test:cli-web-host -- "$RUNNER_TEMP/suite-pack"
